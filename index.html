<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>亲语 · 银发语音助手</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="app">
        <header>
            <div class="logo">💛 亲语</div>
            <div class="subtitle">慢慢说，我在听</div>
        </header>

        <main id="chatArea">
            <div id="messageList">
                <div class="msg-bot first-msg">
                    <div class="avatar">🤖</div>
                    <div class="bubble">
                        您好呀，我是亲语。<br />
                        按住下面的大按钮，把您想说的话告诉我。<br />
                        我会帮您把话说清楚，再帮您打给家人。
                    </div>
                </div>
            </div>
            <div style="height: 160px;"></div>
        </main>

        <footer>
            <div id="statusTip">🎤 按住说话，松开结束</div>

            <!-- 功能模式切换 -->
            <div class="mode-bar">
                <button class="mode-btn active" data-mode="default">💬 帮我说清</button>
                <button class="mode-btn" data-mode="doctor">🏥 就医辅助</button>
                <button class="mode-btn" data-mode="fraud">🛡️ 防骗识别</button>
                <button class="mode-btn" data-mode="medicine">💊 用药提醒</button>
            </div>

            <!-- 主录音按钮 -->
            <button id="recordBtn" class="record-btn">
                <span id="btnIcon">🎤</span>
                <span id="btnText">按住 说话</span>
            </button>

            <!-- 隐藏的文件选择器（拍照查价） -->
            <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" />

            <!-- 辅助按钮 -->
            <div class="action-row">
                <button id="callBtn" class="action-btn" disabled>📞 拨给家人</button>
                <button id="regenerateBtn" class="action-btn" disabled>🔁 再说一遍</button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
